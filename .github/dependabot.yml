version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    # Look for `package.json` and `lock` files in the `root` directory
    directory: '/'
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: 'weekly'
    # Dependabot defaults to 5 open pull requests at a time
    open-pull-requests-limit: 100

    # Cooldown is the number of days after a release to wait until opening a PR
    # This gives us more confidence changes can be merged because changes have been community tested.
    # See: https://github.blog/changelog/2025-07-01-dependabot-supports-configuration-of-a-minimum-package-age/
    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 14

    # Majors that upstream packages currently forbid. Each entry is a hard peer
    # dependency conflict, not a preference -- npm ci fails if they are taken.
    # Re-check when the named package ships support, then drop the entry.
    ignore:
      # @shopify/ui-extensions-react -> @remote-ui/react pins react "<19.0.0".
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      # Same chain pins react-reconciler ">=0.26.0 <0.30.0".
      - dependency-name: 'react-reconciler'
        versions: ['>=0.30.0']
      # @shopify/shopify-app-react-router (incl. v2) pins react-router "^7.6.2".
      - dependency-name: 'react-router'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-router/dev'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-router/fs-routes'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-router/node'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-router/serve'
        update-types: ['version-update:semver-major']
      # eslint-plugin-react / -import / -jsx-a11y do not declare eslint 10 support yet.
      - dependency-name: 'eslint'
        versions: ['>=10.0.0']
      # @types/node should track the Node runtime in `engines` and CI (22.x).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

    groups:

      # Group together PRs of dependant packages
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/client'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      vite:
        patterns:
          - 'vite'
      react-router:
        patterns:
          - '@react-router/dev'
          - '@react-router/fs-routes'
          - '@react-router/node'
          - '@react-router/serve'
          - 'react-router'

      # Group all patch updates not accounted for in prior groups in a single PR.
      # This reduces the number of PRs to review and rebase.
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
